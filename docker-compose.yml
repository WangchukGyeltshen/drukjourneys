services:
  postgres:
    image: postgres:16-alpine
    container_name: drukjourneys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drukjourneys
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: drukjourneys
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
